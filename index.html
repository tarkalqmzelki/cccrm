<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FAFAFA" />
    <meta name="description" content="Calista Concept — Referrals & Revenue Platform" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Calista Concept" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Calista Concept — Referrals</title>
    <script>
      // Prevent flash of wrong theme — runs before React loads.
      (function(){try{var t=localStorage.getItem('cccrm-theme');
        var dark=t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches);
        if(dark)document.documentElement.classList.add('dark');
        var m=document.querySelector('meta[name=theme-color]');
        if(m)m.setAttribute('content',dark?'#0F0F0F':'#FAFAFA');
      }catch(e){}})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
